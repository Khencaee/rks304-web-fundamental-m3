<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-cyan-600 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Panel</h1>
        <nav class="flex gap-4">
            <a href="dashboard.html" class="hover:underline">Dashboard</a>
            <a href="products.html" class="hover:underline">Products</a>
            <a href="#" class="hover:underline">Users</a>
            <a href="#" class="hover:underline">Setting</a>
        </nav>
        <button class="bg-white text-cyan-600 px-4 py-1 rounded hover:bg-gray-200">
            Logout
        </button>
    </header>

    <main class="p-8">
        <h2 class="text-2xl font-bold mb-2">Dashboard</h2>

        <div class="grid grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500 text-sm">Total Penjualan</p>
                <p class="text-2xl font-bold text-cyan-600">Rp 12.000.000</p>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500 text-sm">Total Pengeluaran</p>
                <p class="text-2xl font-bold text-cyan-600">Rp 500.000</p>
            </div>
        
            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500 text-sm">Total Pembelian</p>
                <p class="text-2xl font-bold text-cyan-600">Rp 500.000</p>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500 text-sm">Total Produk</p>
                <p class="text-2xl font-bold text-cyan-600">100 produk</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-8">
        <p>&copy;2026 Admin Template</p>
    </footer>
    
</body>
</html>
