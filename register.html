<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="flex justify-center items-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-cyan-600 mb-6">Register</h1>

            <form id="formRegister" action="dashboard.html">
                <label class="block mb-1 text-sm">Username</label>
                <input type="text" id="username" name="username" class="w-full border rounded px-3 py-2">
                <p id="errorUsername" class="text-red-600 text-sm mb-3 hidden"></p>

                <label class="block mb-1 text-sm">Password</label>
                <input type="password" id="password" name="password" class="w-full border rounded px-3 py-2">
                <p id="errorPassword" class="text-red-600 text-sm mb-3 hidden"></p>

                <label class="block mb-1 text-sm">Nama</label>
                <input type="text" id="nama" name="nama" class="w-full border rounded px-3 py-2">
                <p id="errorNama" class="text-red-600 text-sm mb-3 hidden"></p>

                <label class="block mb-1 text-sm">Tanggal Lahir</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir" class="w-full border rounded px-3 py-2">
                <p id="errorTanggalLahir" class="text-red-600 text-sm mb-3 hidden"></p>

                <label class="block mb-1 text-sm">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" class="w-full border rounded px-3 py-2"></textarea>
                <p id="errorAlamat" class="text-red-600 text-sm mb-3 hidden"></p>

                <label class="block mb-1 text-sm">Nomor Telpon</label>
                <input type="text" id="no_telpon" name="no_telpon" placeholder="628xxxxxxxxxx" class="w-full border rounded px-3 py-2">
                <p id="errorNoTelpon" class="text-red-600 text-sm mb-4 hidden"></p>

                <button type="submit" class="w-full bg-cyan-600 text-white py-2 rounded hover:bg-cyan-700">
                    Register
                </button>
            </form>
        </div>
    </div>

    <script src="validasi_input.js"></script>
</body>
</html>
